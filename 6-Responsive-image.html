<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Bootstrap Link -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1>Basic Responsive Image</h1>
    <img
      src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
      class="img-fluid"
      alt="Responsive image"
    />
    <!-- Scales with container, never overflows -->
    <h1>Thumbnail</h1>
    <img
      src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
      class="img-thumbnail"
      alt="Thumbnail"
    />
    <!-- Image with border, padding, rounded corners -->
    <h1>Rounded image</h1>
    <img
      src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
      class="img-fluid rounded"
      alt="Rounded"
    />

    <img
      src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
      class="img-fluid rounded-circle"
      alt="Circle"
    />

    <img
      src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
      class="img-fluid rounded-pill"
      alt="Pill"
    />

    <h1>centered image</h1>
    <!-- Center with display utilities -->
    <img
      src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
      class="img-fluid mx-auto d-block"
      alt="Centered"
    />

    <!-- Or using text-center wrapper -->
    <div class="text-center">
      <img
        src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
        class="img-fluid"
        alt="Centered"
      />
    </div>

    <h1>Image in Card</h1>
    <div class="card" style="width: 300px">
      <img
        src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
        class="card-img-top img-fluid"
        alt="Card image"
      />
      <div class="card-body">
        <h5 class="card-title">Card Title</h5>
        <p class="card-text">Image is responsive inside card.</p>
      </div>
    </div>
  </body>
</html>
