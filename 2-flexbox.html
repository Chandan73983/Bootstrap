<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Bootstrap Link -->
      <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet" />
  </head>
  <body>
    <h2>Flex Column -> Row</h2>
    <div class="d-flex flex-column flex-md-row">
      <div class="p-2 bg-primary">Item 1</div>
      <div class="p-2 bg-success">Item 2</div>
      <div class="p-2 bg-danger">Item 3</div>
    </div>
    <!-- Mobile: Vertical, Tablet+: Horizontal -->

    <h2>Center Everythings</h2>
    <div
      class="d-flex justify-content-center align-items-center bg-light"
      style="height: 200px"
    >
      <div class="bg-primary p-3 text-white">Perfectly Centered!</div>
    </div>
    <!-- Horizontal + Vertical center -->

    <h2>Space Between</h2>
    <div class="d-flex justify-content-between">
      <div>Left</div>
      <div>Center</div>
      <div>Right</div>
    </div>
    <!-- Space between all items -->

    <h2>Responsive Navbar Like</h2>
    <div
      class="d-flex flex-column flex-md-row justify-content-between align-items-center"
    >
      <h4>Logo</h4>
      <div class="d-flex gap-3">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>
      <button class="btn btn-primary">Login</button>
    </div>
    <!-- Mobile: Vertical stack, Tablet+: Horizontal with space -->

    <h2>Card Grid and Flex</h2>
    <div class="d-flex flex-wrap gap-3">
      <div class="card" style="width: 200px">Card 1</div>
      <div class="card" style="width: 200px">Card 2</div>
      <div class="card" style="width: 200px">Card 3</div>
      <div class="card" style="width: 200px">Card 4</div>
    </div>
    <!-- flex-wrap automatically wraps cards to next line -->
  </body>
</html>
