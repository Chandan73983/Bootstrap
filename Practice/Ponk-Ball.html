<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pong Game</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:#0a0a0a;min-height:100vh;padding:1rem;font-family:'Courier New',monospace;margin:0;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
body[data-bs-theme="light"]{background:#f8fafc;color:#1f2937}

.app{width:100%;max-width:600px;display:flex;flex-direction:column;gap:1rem}

/* Header */
.top-bar{display:flex;justify-content:space-between;align-items:center}
.app-title{font-size:1.5rem;font-weight:900;margin:0;color:#00ffcc;text-shadow:0 0 10px rgba(0,255,204,0.5);letter-spacing:2px}
body[data-bs-theme="light"] .app-title{color:#0ea5e9;text-shadow:none}
.icon-btn{width:36px;height:36px;border-radius:50%;border:2px solid #334155;background:transparent;color:#94a3b8;font-size:1rem;cursor:pointer}
body[data-bs-theme="light"] .icon-btn{border-color:#cbd5e1;color:#475569}

/* Diff Selector */
.diff-row{display:flex;gap:.5rem;justify-content:center}
.diff-btn{flex:1;padding:.4rem;border-radius:8px;border:1px solid #334155;background:transparent;color:#94a3b8;font-size:.75rem;font-weight:bold;cursor:pointer;transition:all .15s}
body[data-bs-theme="light"] .diff-btn{border-color:#cbd5e1;color:#64748b}
.diff-btn.active{background:#00ffcc;color:#000;border-color:#00ffcc}
body[data-bs-theme="light"] .diff-btn.active{background:#0ea5e9;color:#fff;border-color:#0ea5e9}

/* Canvas Area */
.canvas-wrap{position:relative;background:#000;border:4px solid #1e293b;border-radius:12px;box-shadow:0 0 30px rgba(0,255,204,0.1);overflow:hidden;touch-action:none}
body[data-bs-theme="light"] .canvas-wrap{background:#fff;border-color:#cbd5e1;box-shadow:0 10px 30px rgba(0,0,0,0.1)}
#gameCanvas{display:block;width:100%;height:auto;aspect-ratio:3/2}

/* Scores on Canvas */
.score-overlay{position:absolute;top:10px;left:0;width:100%;display:flex;justify-content:space-between;padding:0 10%;pointer-events:none;font-size:3rem;font-weight:900;color:rgba(255,255,255,0.3)}
body[data-bs-theme="light"] .score-overlay{color:rgba(0,0,0,0.1)}

/* Overlay */
.overlay{position:absolute;inset:0;background:rgba(10,10,10,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(4px);text-align:center;padding:1rem}
body[data-bs-theme="light"] .overlay{background:rgba(248,250,252,0.85)}
.overlay.show{opacity:1;pointer-events:all}
.title{font-size:2.5rem;font-weight:900;color:#00ffcc;margin-bottom:.5rem;letter-spacing:3px;text-shadow:0 0 15px rgba(0,255,204,0.5)}
body[data-bs-theme="light"] .title{color:#0ea5e9;text-shadow:none}
.btn-play{background:#00ffcc;color:#000;border:none;border-radius:8px;padding:.75rem 2rem;font-size:1.2rem;font-weight:900;cursor:pointer;transition:transform .15s;margin-top:1rem;box-shadow:0 0 20px rgba(0,255,204,0.4)}
body[data-bs-theme="light"] .btn-play{background:#0ea5e9;color:#fff;box-shadow:none}
.btn-play:active{transform:scale(0.95)}

.instructions{font-size:.85rem;color:#94a3b8;margin-top:.5rem}
body[data-bs-theme="light"] .instructions{color:#64748b}
</style>
</head>
<body>
<div class="app">

  <div class="top-bar">
    <h1 class="app-title">PONG</h1>
    <button class="icon-btn" id="themeBtn"><i class="bi bi-sun"></i></button>
  </div>

  <div class="diff-row">
    <button class="diff-btn" data-diff="easy">Easy</button>
    <button class="diff-btn active" data-diff="medium">Medium</button>
    <button class="diff-btn" data-diff="hard">Hard</button>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    
    <div class="score-overlay">
      <span id="playerScoreUI">0</span>
      <span id="aiScoreUI">0</span>
    </div>

    <div class="overlay show" id="overlay">
      <div class="title" id="overlayTitle">PONG</div>
      <div class="instructions" id="overlayMsg">Drag to move your paddle.<br>First to 5 points wins!</div>
      <button class="btn-play" id="playBtn">START</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ============================================
   PONG GAME
   ============================================ */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvasWrap');

// Internal dimensions
const W = 600;
const H = 400;

// Setup canvas for high-DPI
const dpr = window.devicePixelRatio || 1;
canvas.width = W * dpr;
canvas.height = H * dpr;
ctx.scale(dpr, dpr);

// ---------- CONFIG ----------
const PADDLE_W = 12;
const PADDLE_H = 80;
const BALL_RADIUS = 8;
const BASE_SPEED = 5;
const MAX_SPEED = 12;
const WIN_SCORE = 5;

const AI_DIFFICULTY = {
  easy: { speed: 3.5, reaction: 0.05 },
  medium: { speed: 5, reaction: 0.1 },
  hard: { speed: 7, reaction: 0.2 }
};

// ---------- STATE ----------
let player = { x: 20, y: H/2 - PADDLE_H/2, w: PADDLE_W, h: PADDLE_H, score: 0 };
let ai = { x: W - 20 - PADDLE_W, y: H/2 - PADDLE_H/2, w: PADDLE_W, h: PADDLE_H, score: 0 };
let ball = { x: W/2, y: H/2, dx: BASE_SPEED, dy: BASE_SPEED, r: BALL_RADIUS };
let gameState = 'idle'; // idle | playing | over
let difficulty = 'medium';
let rafId = null;
let isPaused = false;
let audioCtx = null;
let particles = [];

// Colors
function getColors() {
  const isLight = document.documentElement.getAttribute('data-bs-theme') === 'light';
  return {
    player: isLight ? '#0ea5e9' : '#00ffcc',
    ai: isLight ? '#ef4444' : '#ff0055',
    ball: isLight ? '#1f2937' : '#ffffff',
    bg: isLight ? '#ffffff' : '#000000',
    net: isLight ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.1)'
  };
}

// ---------- SOUND ----------
function beep(freq, dur, type = 'square') {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.type = type;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

// ---------- INIT ----------
function resetGame() {
  player.score = 0;
  ai.score = 0;
  updateScoreUI();
  resetBall();
  gameState = 'playing';
  document.getElementById('overlay').classList.remove('show');
  if (rafId) cancelAnimationFrame(rafId);
  lastTime = performance.now();
  loop(lastTime);
}

function resetBall(direction = 1) {
  ball.x = W / 2;
  ball.y = H / 2;
  ball.dx = BASE_SPEED * direction;
  ball.dy = (Math.random() * 2 - 1) * BASE_SPEED;
}

// ---------- UPDATE ----------
let lastTime = 0;

function update(dt) {
  if (gameState !== 'playing' || isPaused) return;

  // 1. Move Ball
  ball.x += ball.dx * dt;
  ball.y += ball.dy * dt;

  // 2. Top/Bottom Wall Collision
  if (ball.y - ball.r < 0) {
    ball.y = ball.r;
    ball.dy *= -1;
    beep(600, 0.05);
  }
  if (ball.y + ball.r > H) {
    ball.y = H - ball.r;
    ball.dy *= -1;
    beep(600, 0.05);
  }

  // 3. Player Paddle Collision
  if (ball.dx < 0 && ball.x - ball.r < player.x + player.w && ball.x + ball.r > player.x) {
    if (ball.y > player.y && ball.y < player.y + player.h) {
      // Hit! Calculate angle based on where it hit the paddle
      let hitPoint = ball.y - (player.y + player.h/2);
      let normalizedHit = hitPoint / (player.h/2); // -1 (top) to 1 (bottom)
      
      let speed = Math.min(MAX_SPEED, Math.sqrt(ball.dx*ball.dx + ball.dy*ball.dy) * 1.05);
      ball.dx = speed * 0.9;
      ball.dy = speed * normalizedHit;
      
      ball.x = player.x + player.w + ball.r; // Prevent sticking
      beep(800, 0.05);
      createParticles(ball.x, ball.y, getColors().player);
    }
  }

  // 4. AI Paddle Collision
  if (ball.dx > 0 && ball.x + ball.r > ai.x && ball.x - ball.r < ai.x + ai.w) {
    if (ball.y > ai.y && ball.y < ai.y + ai.h) {
      let hitPoint = ball.y - (ai.y + ai.h/2);
      let normalizedHit = hitPoint / (ai.h/2);
      
      let speed = Math.min(MAX_SPEED, Math.sqrt(ball.dx*ball.dx + ball.dy*ball.dy) * 1.05);
      ball.dx = -speed * 0.9;
      ball.dy = speed * normalizedHit;
      
      ball.x = ai.x - ball.r;
      beep(400, 0.05);
      createParticles(ball.x, ball.y, getColors().ai);
    }
  }

  // 5. Score
  if (ball.x - ball.r < 0) {
    ai.score++;
    updateScoreUI();
    beep(200, 0.2, 'sawtooth');
    if (ai.score >= WIN_SCORE) return gameOver('AI Wins!');
    resetBall(1); // towards player
  }
  if (ball.x + ball.r > W) {
    player.score++;
    updateScoreUI();
    beep(1000, 0.2, 'sine');
    if (player.score >= WIN_SCORE) return gameOver('You Win!');
    resetBall(-1); // towards AI
  }

  // 6. AI Movement
  const aiConfig = AI_DIFFICULTY[difficulty];
  // Only move if ball is moving towards AI
  if (ball.dx > 0) {
    const targetY = ball.y - ai.h / 2;
    // Add some randomness based on reaction
    let errorMargin = (1 - aiConfig.reaction) * 50 * (Math.random() - 0.5);
    const finalTarget = targetY + errorMargin;

    if (ai.y + ai.h/2 < finalTarget) ai.y += aiConfig.speed * dt;
    else if (ai.y + ai.h/2 > finalTarget) ai.y -= aiConfig.speed * dt;
  } else {
    // Return to center slowly when ball moves away
    if (ai.y + ai.h/2 < H/2 - 10) ai.y += aiConfig.speed * 0.5 * dt;
    else if (ai.y + ai.h/2 > H/2 + 10) ai.y -= aiConfig.speed * 0.5 * dt;
  }

  // Clamp AI
  ai.y = Math.max(0, Math.min(H - ai.h, ai.y));

  // 7. Particles
  particles.forEach((p, i) => {
    p.x += p.vx; p.y += p.vy;
    p.life -= 0.02;
    if (p.life <= 0) particles.splice(i, 1);
  });
}

function updateScoreUI() {
  document.getElementById('playerScoreUI').textContent = player.score;
  document.getElementById('aiScoreUI').textContent = ai.score;
}

// ---------- RENDER ----------
function draw() {
  const colors = getColors();

  // Clear
  ctx.fillStyle = colors.bg;
  ctx.fillRect(0, 0, W, H);

  // Center line
  ctx.beginPath();
  ctx.setLineDash([10, 15]);
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2, H);
  ctx.strokeStyle = colors.net;
  ctx.lineWidth = 4;
  ctx.stroke();
  ctx.setLineDash([]);

  // Draw Paddles
  ctx.shadowBlur = 15;
  
  ctx.fillStyle = colors.player;
  ctx.shadowColor = colors.player;
  roundRect(ctx, player.x, player.y, player.w, player.h, 6);
  ctx.fill();

  ctx.fillStyle = colors.ai;
  ctx.shadowColor = colors.ai;
  roundRect(ctx, ai.x, ai.y, ai.w, ai.h, 6);
  ctx.fill();

  // Draw Ball
  ctx.fillStyle = colors.ball;
  ctx.shadowColor = colors.ball;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();

  // Draw Particles
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function createParticles(x, y, color) {
  for (let i = 0; i < 5; i++) {
    particles.push({
      x, y, color,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      r: Math.random() * 3 + 1,
      life: 1
    });
  }
}

// ---------- GAME LOOP ----------
function loop(time) {
  const dt = Math.min((time - lastTime) / 16.67, 2); // Normalize to 60fps, max 2x
  lastTime = time;

  update(dt);
  draw();

  if (gameState === 'playing') {
    rafId = requestAnimationFrame(loop);
  }
}

function gameOver(msg) {
  gameState = 'over';
  if (rafId) cancelAnimationFrame(rafId);
  
  document.getElementById('overlayTitle').textContent = msg;
  document.getElementById('overlayMsg').textContent = `Final Score: ${player.score} - ${ai.score}`;
  document.getElementById('playBtn').textContent = 'PLAY AGAIN';
  document.getElementById('overlay').classList.add('show');
  beep(300, 0.5, 'sine');
  setTimeout(() => beep(200, 0.5, 'sine'), 200);
}

// ---------- INPUT: TOUCH/MOUSE ----------
function handleMove(clientY) {
  if (gameState !== 'playing') return;
  const rect = canvas.getBoundingClientRect();
  const scaleY = H / rect.height;
  const canvasY = (clientY - rect.top) * scaleY;
  
  player.y = canvasY - player.h / 2;
  player.y = Math.max(0, Math.min(H - player.h, player.y));
}

canvas.addEventListener('mousemove', e => handleMove(e.clientY));
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  handleMove(e.touches[0].clientY);
}, { passive: false });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  handleMove(e.touches[0].clientY);
}, { passive: false });

// Keyboard fallback
const keys = {};
document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

setInterval(() => {
  if (gameState !== 'playing') return;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= 12;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += 12;
  player.y = Math.max(0, Math.min(H - player.h, player.y));
}, 1000 / 60);

// ---------- EVENTS ----------
document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    difficulty = btn.dataset.diff;
  };
});

document.getElementById('playBtn').onclick = resetGame;

document.getElementById('themeBtn').onclick = () => {
  const current = document.documentElement.getAttribute('data-bs-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-bs-theme', next);
  document.getElementById('themeBtn').innerHTML = next === 'light' ? '<i class="bi bi-moon-stars"></i>' : '<i class="bi bi-sun"></i>';
  draw(); // Redraw colors
};

// Prevent scroll on mobile
wrap.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// Initial draw
draw();
</script>
</body>
</html>
