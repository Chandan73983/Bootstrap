<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineStream - Movie Explorer</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<style>
    /* Netflix Base Styles */
    body {
        background-color: #141414;
        color: #fff;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        overflow-x: hidden;
        margin: 0;
        padding-bottom: 50px;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #141414; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }

    /* Navbar */
    .navbar {
        background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
        transition: background-color 0.3s;
        padding: 1rem 2rem;
        z-index: 1000;
    }
    .navbar.scrolled { background-color: #141414; }
    .navbar-brand {
        color: #e50914 !important;
        font-weight: 900;
        font-size: 1.8rem;
        letter-spacing: -1px;
        text-transform: uppercase;
    }
    .nav-link { color: #e5e5e5 !important; font-size: 0.9rem; margin-right: 15px; }
    .nav-link:hover { color: #b3b3b3 !important; }
    .search-box {
        background: rgba(0,0,0,0.7);
        border: 1px solid #333;
        color: #fff;
        border-radius: 4px;
        padding: 0.4rem 1rem;
        width: 200px;
        transition: width 0.3s;
    }
    .search-box:focus {
        background: #000;
        border-color: #fff;
        color: #fff;
        width: 250px;
        outline: none;
    }
    .profile-icon {
        width: 32px;
        height: 32px;
        border-radius: 4px;
        background-color: #e50914;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        color: #fff;
        cursor: pointer;
    }

    /* Hero Section */
    .hero {
        height: 80vh;
        background-size: cover;
        background-position: center top;
        position: relative;
        display: flex;
        align-items: center;
        padding: 0 4rem;
    }
    .hero::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(to right, rgba(20,20,20,0.9) 0%, rgba(20,20,20,0.4) 50%, rgba(20,20,20,0) 100%),
                    linear-gradient(to top, rgba(20,20,20,1) 0%, rgba(20,20,20,0) 30%);
    }
    .hero-content {
        position: relative;
        z-index: 2;
        max-width: 600px;
    }
    .hero-title {
        font-size: 4rem;
        font-weight: 800;
        margin-bottom: 1rem;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    .hero-desc {
        font-size: 1.1rem;
        color: #e5e5e5;
        margin-bottom: 1.5rem;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .btn-play {
        background-color: #fff;
        color: #000;
        font-weight: bold;
        border: none;
        padding: 0.6rem 1.5rem;
        border-radius: 4px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        transition: background 0.2s;
    }
    .btn-play:hover { background-color: rgba(255,255,255,0.8); }
    .btn-info {
        background-color: rgba(109, 109, 110, 0.7);
        color: #fff;
        font-weight: bold;
        border: none;
        padding: 0.6rem 1.5rem;
        border-radius: 4px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
    }
    .btn-info:hover { background-color: rgba(109, 109, 110, 0.4); }

    /* Movie Rows */
    .row-container { margin-top: -80px; position: relative; z-index: 5; padding: 0 2rem; }
    .row-title {
        font-size: 1.4rem;
        font-weight: bold;
        margin-bottom: 0.5rem;
        margin-top: 1.5rem;
    }
    .slider {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 20px 0;
        scroll-behavior: smooth;
    }
    .slider::-webkit-scrollbar { display: none; }
    
    .movie-card {
        min-width: 200px;
        max-width: 200px;
        border-radius: 6px;
        overflow: hidden;
        position: relative;
        cursor: pointer;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .movie-card img {
        width: 100%;
        height: 300px;
        object-fit: cover;
        border-radius: 6px;
        transition: opacity 0.3s;
    }
    .movie-card:hover {
        transform: scale(1.08);
        z-index: 10;
        box-shadow: 0 10px 20px rgba(0,0,0,0.8);
    }
    
    /* Hover Info Overlay */
    .movie-info {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: linear-gradient(to top, #000 0%, rgba(0,0,0,0.8) 60%, transparent 100%);
        padding: 1rem;
        opacity: 0;
        transition: opacity 0.3s;
        border-radius: 0 0 6px 6px;
    }
    .movie-card:hover .movie-info { opacity: 1; }
    .movie-title-small { font-size: 0.9rem; font-weight: bold; margin-bottom: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .movie-year { font-size: 0.75rem; color: #a3a3a3; }

    /* Modal */
    .modal-content {
        background-color: #141414;
        color: #fff;
        border: 1px solid #333;
        border-radius: 10px;
    }
    .modal-header { border-bottom: none; padding: 1.5rem 1.5rem 0; }
    .modal-body { padding: 1.5rem; }
    .modal-img { width: 100%; border-radius: 8px; object-fit: cover; }
    .modal-title { font-weight: 800; font-size: 2rem; }
    .modal-meta { color: #4ade80; font-weight: bold; margin-bottom: 1rem; }

    @media (max-width: 768px) {
        .hero { height: 60vh; padding: 0 2rem; }
        .hero-title { font-size: 2.5rem; }
        .row-container { margin-top: -40px; padding: 0 1rem; }
        .movie-card { min-width: 140px; max-width: 140px; }
        .movie-card img { height: 210px; }
        .search-box { display: none; }
    }
</style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top" id="navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">CINE<span style="color:#fff">STREAM</span></a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <i class="bi bi-list text-white fs-2"></i>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-4">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">TV Shows</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Movies</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">My List</a></li>
                </ul>
                
                <div class="d-flex align-items-center gap-3">
                    <input type="text" class="search-box" placeholder="Search movies...">
                    <div class="profile-icon">U</div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="hero" id="hero" style="background-image: url('https://image.tmdb.org/t/p/original/vpnVM9B6NMmQpWeZvzLvDESb2QY.jpg');">
        <div class="hero-content">
            <h1 class="hero-title" id="heroTitle">Loading...</h1>
            <div class="hero-desc" id="heroDesc">Fetching data from the movie database...</div>
            <div class="d-flex gap-2 mt-3">
                <button class="btn-play"><i class="bi bi-play-fill fs-4"></i> Play</button>
                <button class="btn-info" id="heroMoreInfo"><i class="bi bi-info-circle fs-5"></i> More Info</button>
            </div>
        </div>
    </div>

    <!-- Movie Rows Container -->
    <div class="row-container">
        
        <h2 class="row-title">🔥 Action & Adventure</h2>
        <div class="slider" id="actionRow">
            <!-- Skeleton Loader -->
            <div class="movie-card placeholder-glow"><div class="placeholder w-100 h-100 bg-secondary opacity-25" style="height:300px;"></div></div>
            <div class="movie-card placeholder-glow"><div class="placeholder w-100 h-100 bg-secondary opacity-25" style="height:300px;"></div></div>
            <div class="movie-card placeholder-glow"><div class="placeholder w-100 h-100 bg-secondary opacity-25" style="height:300px;"></div></div>
        </div>

        <h2 class="row-title">😂 Comedy Movies</h2>
        <div class="slider" id="comedyRow">
            <!-- Skeleton Loader -->
            <div class="movie-card placeholder-glow"><div class="placeholder w-100 h-100 bg-secondary opacity-25" style="height:300px;"></div></div>
        </div>

        <h2 class="row-title">🎭 Drama & Thriller</h2>
        <div class="slider" id="dramaRow">
            <!-- Skeleton Loader -->
            <div class="movie-card placeholder-glow"><div class="placeholder w-100 h-100 bg-secondary opacity-25" style="height:300px;"></div></div>
        </div>

    </div>

    <!-- Movie Details Modal -->
    <div class="modal fade" id="movieModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content shadow-lg">
                <div class="modal-header">
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-4">
                        <div class="col-md-5">
                            <img src="" id="modalImg" class="modal-img shadow" alt="Poster">
                        </div>
                        <div class="col-md-7">
                            <h2 class="modal-title" id="modalTitle">Movie Title</h2>
                            <div class="modal-meta" id="modalMeta">Year • Rating</div>
                            <p class="text-light" id="modalDesc" style="font-size:0.95rem; line-height:1.6;">Movie description goes here...</p>
                            
                            <hr class="border-secondary">
                            <div class="mb-2"><strong>Cast:</strong> <span class="text-muted" id="modalCast">N/A</span></div>
                            <div class="mb-2"><strong>Director:</strong> <span class="text-muted" id="modalDirector">N/A</span></div>
                            
                            <button class="btn-play mt-3 w-100 justify-content-center"><i class="bi bi-play-fill fs-4"></i> Play Movie</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ============================================
   CINESTREAM - NETFLIX CLONE
   ============================================ */

// Using a reliable public movie API (SampleAPIs)
const API_BASE = 'https://api.sampleapis.com/movies';

// Global state for current modal movie
let modalMovie = null;
const movieModal = new bootstrap.Modal(document.getElementById('movieModal'));

// Navbar Scroll Effect
window.addEventListener('scroll', () => {
    const navbar = document.getElementById('navbar');
    if (window.scrollY > 50) {
        navbar.classList.add('scrolled');
    } else {
        navbar.classList.remove('scrolled');
    }
});

// ============================================
// FETCH DATA FROM API
// ============================================
async function fetchMovies(category, rowId) {
    try {
        const response = await fetch(`${API_BASE}/${category}`);
        if (!response.ok) throw new Error('Network error');
        
        const movies = await response.json();
        
        // Take first 15 movies for the row
        const displayMovies = movies.slice(0, 15);
        
        renderRow(displayMovies, rowId);

        // Set Hero Content (First movie of action category)
        if (category === 'action' && displayMovies.length > 0) {
            setHero(displayMovies[0]);
        }

    } catch (error) {
        console.error('Error fetching movies:', error);
        document.getElementById(rowId).innerHTML = `<p class="text-danger">Failed to load movies. Please try again later.</p>`;
    }
}

// ============================================
// RENDER MOVIE ROW
// ============================================
function renderRow(movies, containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = ''; // Remove skeletons

    movies.forEach(movie => {
        // Create Movie Card
        const card = document.createElement('div');
        card.className = 'movie-card';
        
        // Sample API structure: movie.posterURL, movie.title, movie.imdbId
        // Fallback poster if image fails
        const imgUrl = movie.posterURL || 'https://via.placeholder.com/200x300/333/fff?text=No+Poster';

        card.innerHTML = `
            <img src="${imgUrl}" alt="${movie.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x300/333/fff?text=No+Poster'">
            <div class="movie-info">
                <div class="movie-title-small">${movie.title}</div>
                <div class="movie-year">Click for details</div>
            </div>
        `;

        // Click Event for Modal
        card.addEventListener('click', () => openModal(movie));

        container.appendChild(card);
    });
}

// ============================================
// SET HERO SECTION
// ============================================
function setHero(movie) {
    const title = movie.title;
    const desc = `Watch ${movie.title} now on CineStream. An amazing blockbuster hit that you cannot miss.`;
    
    // We use a generic backdrop for the hero since SampleAPI doesn't provide backdrops
    const backdropUrl = 'https://image.tmdb.org/t/p/original/628Dep6AxEtDxjZoGP78TsOxYbK.jpg'; // Generic movie backdrop

    document.getElementById('hero').style.backgroundImage = `url('${backdropUrl}')`;
    document.getElementById('heroTitle').textContent = title;
    document.getElementById('heroDesc').textContent = desc;
    
    // Hero More Info Button
    document.getElementById('heroMoreInfo').onclick = () => openModal(movie);
}

// ============================================
// OPEN MODAL
// ============================================
function openModal(movie) {
    modalMovie = movie;
    
    document.getElementById('modalTitle').textContent = movie.title;
    document.getElementById('modalImg').src = movie.posterURL || 'https://via.placeholder.com/300x450/333/fff?text=No+Poster';
    
    // Fake Meta Data since SampleAPI is limited
    document.getElementById('modalMeta').textContent = `2023 • 4.5 ★ • 2h 15m`;
    
    document.getElementById('modalDesc').textContent = `This is a placeholder description for ${movie.title}. The movie is about an incredible journey filled with action, drama, and unexpected twists. Watch it now to find out what happens next!`;
    
    document.getElementById('modalCast').textContent = "John Doe, Jane Smith, Michael Johnson";
    document.getElementById('modalDirector').textContent = "Christopher Nolan";

    movieModal.show();
}

// ============================================
// INITIALIZE APP
// ============================================
document.addEventListener('DOMContentLoaded', () => {
    // Fetch all categories
    fetchMovies('action', 'actionRow');
    fetchMovies('comedy', 'comedyRow');
    fetchMovies('drama', 'dramaRow');
});

</script>
</body>
</html>
