<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake & Ladders</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:#1e1e2f;min-height:100vh;padding:1rem;font-family:system-ui;margin:0;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
body[data-bs-theme="light"]{background:#f1f5f9;color:#1e293b}

.app{width:100%;max-width:600px;display:flex;flex-direction:column;gap:1rem}

/* Header */
.top-bar{display:flex;justify-content:space-between;align-items:center}
.app-title{font-size:1.5rem;font-weight:900;margin:0;color:#fbbf24;letter-spacing:1px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:2px solid #334155;background:transparent;color:#94a3b8;font-size:1rem;cursor:pointer}
body[data-bs-theme="light"] .icon-btn{border-color:#cbd5e1;color:#475569}

/* Game Layout */
.game-area{display:flex;flex-direction:column;gap:1rem;align-items:center}

/* Board */
.board-wrapper{position:relative;width:100%;aspect-ratio:1;background:#111827;border:4px solid #334155;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
body[data-bs-theme="light"] .board-wrapper{background:#fff;border-color:#cbd5e1;box-shadow:0 10px 30px rgba(0,0,0,0.1)}

.grid-container{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);width:100%;height:100%}
.cell{position:relative;border:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;font-size:0.6rem;font-weight:bold;color:rgba(255,255,255,0.3)}
body[data-bs-theme="light"] .cell{border-color:rgba(0,0,0,0.05);color:rgba(0,0,0,0.3)}
.cell.even{background:#1f2937}
.cell.odd{background:#374151}
body[data-bs-theme="light"] .cell.even{background:#f8fafc}
body[data-bs-theme="light"] .cell.odd{background:#e2e8f0}

/* SVG Overlay */
.svg-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}

/* Tokens */
.token{position:absolute;width:8%;height:8%;border-radius:50%;z-index:5;transition:all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,0.5);border:2px solid #fff}
.token.p1{background:#ef4444;transform:translate(-10%, -10%)}
.token.p2{background:#3b82f6;transform:translate(10%, 10%)}
.token i{color:#fff;font-size:0.6rem}

/* Controls */
.controls{display:flex;justify-content:space-between;align-items:center;width:100%;background:#111827;padding:.75rem 1rem;border-radius:12px;border:1px solid #334155}
body[data-bs-theme="light"] .controls{background:#fff;border-color:#cbd5e1}

.turn-indicator{font-weight:bold;font-size:1rem;display:flex;align-items:center;gap:.5rem}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot.p1{background:#ef4444}
.dot.p2{background:#3b82f6}

.dice-box{display:flex;align-items:center;gap:1rem}
.dice{width:50px;height:50px;background:#fff;color:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;box-shadow:inset 0 -4px 0 rgba(0,0,0,0.1), 0 4px 10px rgba(0,0,0,0.3);cursor:pointer;transition:transform .1s}
.dice:active{transform:scale(0.9)}
.dice.rolling{animation:roll 0.5s infinite linear}
@keyframes roll{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}

.btn-roll{background:#fbbf24;color:#111;border:none;border-radius:8px;padding:.5rem 1rem;font-weight:900;font-size:.9rem;cursor:pointer;box-shadow:0 4px 15px rgba(251,191,36,0.4)}
.btn-roll:disabled{background:#475569;color:#94a3b8;box-shadow:none;cursor:not-allowed}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(5px)}
.overlay.show{opacity:1;pointer-events:all}
.modal-box{background:#1e293b;border:2px solid #fbbf24;padding:2rem;border-radius:20px;text-align:center;max-width:300px;width:90%;box-shadow:0 0 40px rgba(251,191,36,0.3)}
.modal-icon{font-size:4rem;margin-bottom:.5rem;display:block}
.modal-title{font-weight:900;font-size:1.5rem;color:#fbbf24;margin-bottom:.5rem}
.btn-play{background:#fbbf24;color:#000;border:none;padding:.75rem;border-radius:12px;font-weight:900;width:100%;margin-top:1rem;cursor:pointer}
</style>
</head>
<body>
<div class="app">

  <div class="top-bar">
    <h1 class="app-title">Saanp Seedhi 🐍</h1>
    <button class="icon-btn" id="themeBtn"><i class="bi bi-sun"></i></button>
  </div>

  <div class="game-area">
    
    <div class="board-wrapper" id="boardWrap">
      <div class="grid-container" id="grid"></div>
      
      <svg class="svg-overlay" id="svgLayer"></svg>

      <!-- Player Tokens -->
      <div class="token p1" id="token1"><i class="bi bi-person-fill"></i></div>
      <div class="token p2" id="token2"><i class="bi bi-person-fill"></i></div>
    </div>

    <div class="controls">
      <div class="turn-indicator">
        <span class="dot p1" id="turnDot"></span>
        <span id="turnText">Player 1 Turn</span>
      </div>
      
      <div class="dice-box">
        <div class="dice" id="diceUI">🎲</div>
        <button class="btn-roll" id="rollBtn">ROLL</button>
      </div>
    </div>

  </div>

</div>

<div class="overlay" id="winOverlay">
  <div class="modal-box">
    <span class="modal-icon">🏆</span>
    <div class="modal-title" id="winTitle">Player 1 Wins!</div>
    <p style="color:#94a3b8;font-size:.9rem">Congratulations on reaching 100!</p>
    <button class="btn-play" id="restartBtn">Play Again</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ============================================
   SNAKE & LADDERS
   ============================================ */

// ---------- CONFIG ----------
const SNAKES = {
  99: 78, 95: 75, 92: 88, 89: 68, 74: 53,
  64: 60, 62: 19, 49: 11, 46: 25, 16: 6
};

const LADDERS = {
  2: 38, 7: 14, 8: 31, 15: 26, 21: 42,
  28: 84, 36: 44, 51: 67, 71: 91, 78: 98
};

// ---------- STATE ----------
let p1Pos = 1;
let p2Pos = 1;
let currentPlayer = 1;
let isRolling = false;
let gameOver = false;
let audioCtx = null;

// DOM
const gridEl = document.getElementById('grid');
const svgLayer = document.getElementById('svgLayer');
const token1 = document.getElementById('token1');
const token2 = document.getElementById('token2');
const diceUI = document.getElementById('diceUI');
const rollBtn = document.getElementById('rollBtn');
const turnDot = document.getElementById('turnDot');
const turnText = document.getElementById('turnText');
const winOverlay = document.getElementById('winOverlay');

const DICE_FACES = ['⚀','⚁','⚂','⚃','⚄','⚅'];

// ---------- SOUND ----------
function beep(freq, dur, type='square') {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.type = type;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

// ---------- BOARD GENERATION ----------
// Returns {x, y} in % (0 to 100) for a given cell number (1-100)
function getCoordinates(pos) {
  let row = Math.floor((pos - 1) / 10); // 0 to 9 (0 is bottom, 9 is top)
  let col = (pos - 1) % 10;
  
  // Alternating rows
  if (row % 2 !== 0) {
    col = 9 - col;
  }
  
  // Convert to percentages
  let x = col * 10;
  let y = (9 - row) * 10; // SVG y goes top to bottom
  
  return { x, y };
}

function buildBoard() {
  gridEl.innerHTML = '';
  
  // Create cells
  // Top row (91-100) is visually at the top, so we count backwards
  for (let r = 9; r >= 0; r--) {
    for (let c = 0; c < 10; c++) {
      let pos;
      if (r % 2 === 0) {
        pos = r * 10 + c + 1;
      } else {
        pos = r * 10 + (9 - c) + 1;
      }
      
      const cell = document.createElement('div');
      cell.className = `cell ${pos % 2 === 0 ? 'even' : 'odd'}`;
      cell.textContent = pos;
      gridEl.appendChild(cell);
    }
  }

  drawSnakesAndLadders();
  updateTokens();
}

function drawSnakesAndLadders() {
  svgLayer.innerHTML = ''; // Clear SVG

  // Draw Ladders
  for (let start in LADDERS) {
    let end = LADDERS[start];
    let p1 = getCoordinates(parseInt(start));
    let p2 = getCoordinates(end);
    
    // Draw ladder lines
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", p1.x + 5 + "%");
    line.setAttribute("y1", p1.y + 5 + "%");
    line.setAttribute("x2", p2.x + 5 + "%");
    line.setAttribute("y2", p2.y + 5 + "%");
    line.setAttribute("stroke", "#8b5a2b");
    line.setAttribute("stroke-width", "3");
    line.setAttribute("stroke-dasharray", "5,5");
    line.setAttribute("opacity", "0.7");
    svgLayer.appendChild(line);
  }

  // Draw Snakes
  for (let start in SNAKES) {
    let end = SNAKES[start];
    let p1 = getCoordinates(parseInt(start));
    let p2 = getCoordinates(end);
    
    // Draw snake curved path
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    // Curve control point
    let midX = (p1.x + p2.x) / 2 + 10;
    let midY = (p1.y + p2.y) / 2;
    const d = `M ${p1.x+5}% ${p1.y+5}% Q ${midX}% ${midY}% ${p2.x+5}% ${p2.y+5}%`;
    
    path.setAttribute("d", d);
    path.setAttribute("stroke", "#ef4444");
    path.setAttribute("stroke-width", "4");
    path.setAttribute("fill", "none");
    path.setAttribute("opacity", "0.6");
    path.setAttribute("stroke-linecap", "round");
    svgLayer.appendChild(path);
    
    // Snake Head
    const head = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    head.setAttribute("cx", p1.x + 5 + "%");
    head.setAttribute("cy", p1.y + 5 + "%");
    head.setAttribute("r", "6");
    head.setAttribute("fill", "#ef4444");
    svgLayer.appendChild(head);
  }
}

// ---------- TOKEN MOVEMENT ----------
function updateTokens() {
  let pos1 = getCoordinates(p1Pos);
  let pos2 = getCoordinates(p2Pos);

  // Token 1
  token1.style.left = pos1.x + "%";
  token1.style.top = pos1.y + "%";
  
  // Token 2
  token2.style.left = pos2.x + "%";
  token2.style.top = pos2.y + "%";
}

// ---------- GAME LOGIC ----------
rollBtn.onclick = () => {
  if (isRolling || gameOver) return;
  
  isRolling = true;
  rollBtn.disabled = true;
  diceUI.classList.add('rolling');
  
  // Roll animation
  let rollCount = 0;
  let animInterval = setInterval(() => {
    diceUI.textContent = DICE_FACES[Math.floor(Math.random() * 6)];
    beep(300 + Math.random()*200, 0.02);
    rollCount++;
    
    if (rollCount > 10) {
      clearInterval(animInterval);
      finishRoll();
    }
  }, 50);
};

function finishRoll() {
  const diceValue = Math.floor(Math.random() * 6) + 1;
  diceUI.textContent = DICE_FACES[diceValue - 1];
  diceUI.classList.remove('rolling');
  
  beep(600, 0.1, 'sine');
  
  let currentPos = currentPlayer === 1 ? p1Pos : p2Pos;
  let newPos = currentPos + diceValue;
  
  if (newPos > 100) {
    // Need exact roll
    newPos = currentPos;
    beep(200, 0.2, 'sawtooth');
  }
  
  // Move step by step for visual effect
  animateMove(currentPlayer, currentPos, newPos, diceValue);
}

function animateMove(player, from, to, diceValue) {
  let current = from;
  
  function step() {
    if (current < to) {
      current++;
      if (player === 1) p1Pos = current; else p2Pos = current;
      updateTokens();
      beep(400, 0.02);
      setTimeout(step, 150); // Speed of step
    } else {
      // Check for snakes or ladders
      checkSpecialCells(player, to);
    }
  }
  
  if (from === to) {
    // Didn't move (exact roll needed)
    endTurn();
  } else {
    step();
  }
}

function checkSpecialCells(player, pos) {
  let finalPos = pos;
  
  if (LADDERS[pos]) {
    finalPos = LADDERS[pos];
    beep(800, 0.2, 'sine'); // Ladder sound
    setTimeout(() => beep(1000, 0.2, 'sine'), 100);
  } else if (SNAKES[pos]) {
    finalPos = SNAKES[pos];
    beep(200, 0.3, 'sawtooth'); // Snake sound
  }
  
  if (finalPos !== pos) {
    // Move to final pos
    setTimeout(() => {
      if (player === 1) p1Pos = finalPos; else p2Pos = finalPos;
      updateTokens();
    }, 300);
    
    setTimeout(endTurn, 800);
  } else {
    setTimeout(endTurn, 500);
  }
}

function endTurn() {
  // Check win
  if (p1Pos === 100) {
    gameOver = true;
    showWinScreen(1);
    return;
  }
  if (p2Pos === 100) {
    gameOver = true;
    showWinScreen(2);
    return;
  }

  // Switch turn
  currentPlayer = currentPlayer === 1 ? 2 : 1;
  isRolling = false;
  rollBtn.disabled = false;
  
  updateTurnUI();
}

function updateTurnUI() {
  if (currentPlayer === 1) {
    turnDot.className = 'dot p1';
    turnText.textContent = 'Player 1 Turn';
    turnText.style.color = '#ef4444';
  } else {
    turnDot.className = 'dot p2';
    turnText.textContent = 'Player 2 Turn';
    turnText.style.color = '#3b82f6';
  }
}

function showWinScreen(player) {
  document.getElementById('winTitle').textContent = `Player ${player} Wins!`;
  document.getElementById('winTitle').style.color = player === 1 ? '#ef4444' : '#3b82f6';
  winOverlay.classList.add('show');
  
  // Win sound
  [600, 800, 1000, 1200].forEach((freq, i) => {
    setTimeout(() => beep(freq, 0.2, 'sine'), i * 150);
  });
}

document.getElementById('restartBtn').onclick = () => {
  p1Pos = 1; p2Pos = 1;
  currentPlayer = 1;
  gameOver = false;
  isRolling = false;
  rollBtn.disabled = false;
  winOverlay.classList.remove('show');
  
  updateTokens();
  updateTurnUI();
};

// Theme
document.getElementById('themeBtn').onclick = () => {
  const current = document.documentElement.getAttribute('data-bs-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-bs-theme', next);
  document.getElementById('themeBtn').innerHTML = next === 'light' ? '<i class="bi bi-moon-stars"></i>' : '<i class="bi bi-sun"></i>';
};

// ---------- START ----------
buildBoard();
updateTurnUI();
</script>
</body>
</html>
