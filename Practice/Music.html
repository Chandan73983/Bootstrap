<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<style>
body{background:linear-gradient(160deg,#232526,#414345);min-height:100vh;padding:1rem;font-family:system-ui;color:#fff;margin:0}
body[data-bs-theme="light"]{background:linear-gradient(160deg,#667eea,#764ba2)}
.app{max-width:480px;margin:0 auto}
.player{background:rgba(255,255,255,.08);backdrop-filter:blur(20px);border-radius:24px;padding:1.5rem;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.15)}
.album-wrap{position:relative;width:220px;height:220px;margin:0 auto 1.25rem}
.album-art{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#f093fb,#f5576c);display:flex;align-items:center;justify-content:center;font-size:5rem;box-shadow:0 15px 40px rgba(0,0,0,.4);position:relative;overflow:hidden}
.album-art::before{content:'';position:absolute;width:35%;height:35%;background:#232526;border-radius:50%;box-shadow:inset 0 0 20px rgba(0,0,0,.5)}
.album-art.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.album-art i{position:relative;z-index:1;color:rgba(255,255,255,.7)}
.song-title{font-size:1.15rem;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-artist{font-size:.85rem;text-align:center;color:rgba(255,255,255,.6);margin-bottom:1rem}
.progress-wrap{display:flex;align-items:center;gap:.5rem;font-size:.75rem;color:rgba(255,255,255,.7)}
.progress-bar-custom{flex-grow:1;height:6px;background:rgba(255,255,255,.15);border-radius:10px;position:relative;cursor:pointer}
.progress-fill{height:100%;background:linear-gradient(90deg,#f093fb,#f5576c);border-radius:10px;width:0%;transition:width .1s linear}
.progress-thumb{position:absolute;top:50%;width:14px;height:14px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.3);opacity:0;transition:opacity .2s}
.progress-bar-custom:hover .progress-thumb{opacity:1}
.controls{display:flex;align-items:center;justify-content:center;gap:1rem;margin:1.25rem 0}
.ctrl-btn{background:rgba(255,255,255,.1);border:none;color:#fff;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.15rem;transition:all .15s}
.ctrl-btn:hover{background:rgba(255,255,255,.2)}
.ctrl-btn.active{background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff}
.play-btn{width:64px;height:64px;background:linear-gradient(135deg,#f093fb,#f5576c);font-size:1.5rem;box-shadow:0 10px 25px rgba(245,87,108,.5)}
.play-btn:hover{transform:scale(1.05);background:linear-gradient(135deg,#f093fb,#f5576c)}
.volume-row{display:flex;align-items:center;gap:.5rem;color:rgba(255,255,255,.7);font-size:.9rem}
.volume-row input{flex-grow:1}
.playlist{background:rgba(255,255,255,.08);border-radius:20px;padding:1rem;margin-top:1rem;border:1px solid rgba(255,255,255,.15);max-height:300px;overflow-y:auto}
.pl-item{display:flex;align-items:center;gap:.75rem;padding:.6rem .75rem;border-radius:12px;cursor:pointer;transition:background .15s}
.pl-item:hover{background:rgba(255,255,255,.08)}
.pl-item.active{background:rgba(245,87,108,.25)}
.pl-thumb{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#f093fb,#f5576c);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.2rem}
.pl-info{flex-grow:1;min-width:0}
.pl-title{font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-artist{font-size:.75rem;color:rgba(255,255,255,.5)}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px}
.eq span{width:3px;background:#f5576c;border-radius:2px;animation:eq .8s ease-in-out infinite}
.eq span:nth-child(2){animation-delay:.2s}
.eq span:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
input[type=range]{accent-color:#f5576c}
</style>
</head>
<body>
<div class="app">
  <div class="player">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0">🎵 Music Player</h5>
      <button class="ctrl-btn" id="themeBtn" style="width:36px;height:36px;font-size:1rem"><i class="bi bi-moon-stars"></i></button>
    </div>

    <!-- Album art -->
    <div class="album-wrap">
      <div class="album-art" id="albumArt"><i class="bi bi-music-note-beamed"></i></div>
    </div>

    <!-- Song info -->
    <div class="song-title" id="songTitle">No song selected</div>
    <div class="song-artist" id="songArtist">Add songs to get started</div>

    <!-- Progress -->
    <div class="progress-wrap">
      <span id="currentTime">0:00</span>
      <div class="progress-bar-custom" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-thumb" id="progressThumb"></div>
      </div>
      <span id="duration">0:00</span>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn" id="shuffleBtn" title="Shuffle"><i class="bi bi-shuffle"></i></button>
      <button class="ctrl-btn" id="prevBtn"><i class="bi bi-skip-start-fill"></i></button>
      <button class="ctrl-btn play-btn" id="playBtn"><i class="bi bi-play-fill"></i></button>
      <button class="ctrl-btn" id="nextBtn"><i class="bi bi-skip-end-fill"></i></button>
      <button class="ctrl-btn" id="repeatBtn" title="Repeat"><i class="bi bi-repeat"></i></button>
    </div>

    <!-- Volume -->
    <div class="volume-row mb-3">
      <i class="bi bi-volume-down"></i>
      <input type="range" id="volumeSlider" min="0" max="100" value="80">
      <i class="bi bi-volume-up"></i>
    </div>

    <!-- Add songs -->
    <input type="file" id="fileInput" accept="audio/*" multiple style="display:none">
    <button class="btn w-100" id="addBtn" style="background:rgba(255,255,255,.12);color:#fff;border-radius:50px;font-weight:600">
      <i class="bi bi-plus-circle me-1"></i>Add Songs From Phone
    </button>

    <!-- Playlist -->
    <div class="playlist" id="playlist"></div>

  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ---------- DEMO SONGS ----------
const DEMO_SONGS = [
  { title: 'Ambient Dreams', artist: 'Demo Track', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
  { title: 'Night Sky', artist: 'Demo Track', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
  { title: 'Ocean Waves', artist: 'Demo Track', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' }
];

// ---------- STATE ----------
let playlist = [...DEMO_SONGS];
let currentIdx = -1;
let isPlaying = false;
let isShuffle = false;
let repeatMode = 'off'; // off | all | one
let theme = localStorage.getItem('music-theme') || 'dark';

// ---------- ELEMENTS ----------
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const repeatBtn = document.getElementById('repeatBtn');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const progressThumb = document.getElementById('progressThumb');
const volumeSlider = document.getElementById('volumeSlider');
const currentTimeEl = document.getElementById('currentTime');
const durationEl = document.getElementById('duration');
const songTitle = document.getElementById('songTitle');
const songArtist = document.getElementById('songArtist');
const albumArt = document.getElementById('albumArt');
const playlistEl = document.getElementById('playlist');
const fileInput = document.getElementById('fileInput');

audio.volume = 0.8;

// ---------- HELPERS ----------
function fmtTime(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

// ---------- RENDER ----------
function renderPlaylist() {
  if (playlist.length === 0) {
    playlistEl.innerHTML = '<div class="text-center py-3" style="color:rgba(255,255,255,.5);font-size:.85rem">No songs. Add some!</div>';
    return;
  }
  playlistEl.innerHTML = playlist.map((s, i) => `
    <div class="pl-item ${i===currentIdx?'active':''}" data-idx="${i}">
      <div class="pl-thumb">
        ${i===currentIdx && isPlaying 
          ? '<div class="eq"><span></span><span></span><span></span></div>' 
          : '<i class="bi bi-music-note"></i>'}
      </div>
      <div class="pl-info">
        <div class="pl-title">${s.title}</div>
        <div class="pl-artist">${s.artist}</div>
      </div>
      ${i>=DEMO_SONGS.length ? '<button class="ctrl-btn" style="width:32px;height:32px;font-size:.8rem" data-del="'+i+'"><i class="bi bi-x"></i></button>' : ''}
    </div>
  `).join('');

  playlistEl.querySelectorAll('.pl-item').forEach(item => {
    item.onclick = (e) => {
      if (e.target.closest('[data-del]')) return;
      loadSong(parseInt(item.dataset.idx));
      play();
    };
  });
  playlistEl.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); removeSong(parseInt(b.dataset.del)); };
  });
}

function updateUI() {
  const s = playlist[currentIdx];
  if (!s) {
    songTitle.textContent = 'No song selected';
    songArtist.textContent = 'Add songs to get started';
    return;
  }
  songTitle.textContent = s.title;
  songArtist.textContent = s.artist;
  playBtn.innerHTML = isPlaying ? '<i class="bi bi-pause-fill"></i>' : '<i class="bi bi-play-fill"></i>';
  albumArt.classList.toggle('spin', isPlaying);
  renderPlaylist();
}

// ---------- LOAD & PLAY ----------
function loadSong(idx, autoplay = false) {
  if (idx < 0 || idx >= playlist.length) return;
  currentIdx = idx;
  audio.src = playlist[idx].src;
  audio.load();
  updateUI();
  if (autoplay) play();
}

function play() {
  if (currentIdx < 0 && playlist.length > 0) loadSong(0);
  if (currentIdx < 0) return;
  audio.play().then(() => {
    isPlaying = true;
    updateUI();
  }).catch(err => {
    console.error('Play error:', err);
    isPlaying = false;
    updateUI();
  });
}

function pause() {
  audio.pause();
  isPlaying = false;
  updateUI();
}

function togglePlay() {
  if (isPlaying) pause();
  else play();
}

function next() {
  if (playlist.length === 0) return;
  if (isShuffle) {
    currentIdx = Math.floor(Math.random() * playlist.length);
  } else {
    currentIdx = (currentIdx + 1) % playlist.length;
  }
  loadSong(currentIdx, true);
}

function prev() {
  if (playlist.length === 0) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  if (isShuffle) {
    currentIdx = Math.floor(Math.random() * playlist.length);
  } else {
    currentIdx = (currentIdx - 1 + playlist.length) % playlist.length;
  }
  loadSong(currentIdx, true);
}

function removeSong(idx) {
  if (idx < DEMO_SONGS.length) return; // Can't delete demo
  playlist.splice(idx, 1);
  if (idx === currentIdx) { pause(); currentIdx = -1; loadSong(0); }
  else if (idx < currentIdx) currentIdx--;
  renderPlaylist();
}

// ---------- AUDIO EVENTS ----------
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  progressFill.style.width = pct + '%';
  progressThumb.style.left = pct + '%';
  currentTimeEl.textContent = fmtTime(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {
  durationEl.textContent = fmtTime(audio.duration);
});

audio.addEventListener('ended', () => {
  if (repeatMode === 'one') {
    audio.currentTime = 0;
    play();
  } else if (repeatMode === 'all' || currentIdx < playlist.length - 1 || isShuffle) {
    next();
  } else {
    isPlaying = false;
    updateUI();
  }
});

audio.addEventListener('play', () => { isPlaying = true; updateUI(); });
audio.addEventListener('pause', () => { isPlaying = false; updateUI(); });

// ---------- SEEK ----------
progressBar.addEventListener('click', (e) => {
  if (!audio.duration) return;
  const rect = progressBar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});

// ---------- VOLUME ----------
volumeSlider.addEventListener('input', (e) => {
  audio.volume = e.target.value / 100;
});

// ---------- BUTTON EVENTS ----------
playBtn.onclick = togglePlay;
nextBtn.onclick = next;
prevBtn.onclick = prev;

shuffleBtn.onclick = () => {
  isShuffle = !isShuffle;
  shuffleBtn.classList.toggle('active', isShuffle);
};

repeatBtn.onclick = () => {
  repeatMode = repeatMode === 'off' ? 'all' : repeatMode === 'all' ? 'one' : 'off';
  repeatBtn.classList.toggle('active', repeatMode !== 'off');
  repeatBtn.innerHTML = repeatMode === 'one' ? '<i class="bi bi-repeat-1"></i>' : '<i class="bi bi-repeat"></i>';
};

// ---------- ADD OWN SONGS ----------
document.getElementById('addBtn').onclick = () => fileInput.click();

fileInput.onchange = (e) => {
  const files = Array.from(e.target.files);
  files.forEach(file => {
    const url = URL.createObjectURL(file);
    playlist.push({
      title: file.name.replace(/\.[^.]+$/, ''),
      artist: 'From device',
      src: url
    });
  });
  renderPlaylist();
  if (currentIdx < 0 && playlist.length > 0) loadSong(0);
};

// ---------- THEME ----------
function applyTheme() {
  document.documentElement.setAttribute('data-bs-theme', theme);
  document.getElementById('themeBtn').innerHTML = theme === 'light' ? '<i class="bi bi-sun"></i>' : '<i class="bi bi-moon-stars"></i>';
}
document.getElementById('themeBtn').onclick = () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('music-theme', theme);
  applyTheme();
};

// ---------- INIT ----------
applyTheme();
renderPlaylist();
loadSong(0, false);
</script>
</body>
</html>
