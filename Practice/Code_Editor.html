<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VS Code Clone - Working IDE</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<!-- CodeMirror CSS (Editor ke liye) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/fold/foldgutter.min.css">

<style>
    :root {
        --bg-dark: #1e1e1e;
        --bg-darker: #181818;
        --sidebar-bg: #252526;
        --activity-bg: #333333;
        --text-main: #cccccc;
        --text-muted: #858585;
        --accent: #007acc;
        --border: #3c3c3c;
        --hover: #2a2d2e;
    }

    * { box-sizing: border-box; }
    body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        font-size: 13px;
    }

    /* Layout */
    .app-container { display: flex; flex-direction: column; height: 100vh; }
    
    /* Top Title Bar */
    .title-bar {
        background-color: var(--bg-darker);
        height: 35px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        border-bottom: 1px solid var(--border);
    }
    .title-bar .menu { display: flex; gap: 15px; align-items: center; }
    .title-bar .menu span { cursor: pointer; color: var(--text-muted); }
    .title-bar .menu span:hover { color: #fff; }
    
    /* Main Content area */
    .main-content { display: flex; flex-grow: 1; overflow: hidden; }

    /* Activity Bar */
    .activity-bar {
        width: 48px;
        background-color: var(--activity-bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 10px;
        border-right: 1px solid var(--border);
    }
    .activity-icon {
        color: var(--text-muted);
        font-size: 22px;
        margin-bottom: 25px;
        cursor: pointer;
    }
    .activity-icon.active { color: #fff; border-left: 2px solid var(--accent); padding-left: 10px; margin-left: -10px;}

    /* Sidebar (File Explorer) */
    .sidebar {
        width: 220px;
        background-color: var(--sidebar-bg);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
    }
    .sidebar-header {
        padding: 10px 15px;
        font-size: 11px;
        text-transform: uppercase;
        font-weight: bold;
        color: var(--text-muted);
    }
    .file-item {
        padding: 6px 15px 6px 25px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-main);
    }
    .file-item:hover { background-color: var(--hover); }
    .file-item.active { background-color: #37373d; color: #fff; }

    /* Editor Area */
    .editor-area { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
    
    /* Tabs */
    .tabs {
        display: flex;
        background-color: var(--bg-darker);
        border-bottom: 1px solid var(--border);
    }
    .tab {
        padding: 8px 15px;
        display: flex;
        align-items: center;
        gap: 8px;
        background-color: var(--bg-darker);
        color: var(--text-muted);
        border-right: 1px solid var(--border);
        cursor: pointer;
    }
    .tab.active {
        background-color: var(--bg-dark);
        color: #fff;
        border-top: 1px solid var(--accent);
    }

    /* CodeMirror Customization */
    .CodeMirror {
        height: calc(100vh - 220px) !important;
        font-family: 'Courier New', monospace;
        font-size: 14px;
    }

    /* Terminal Panel */
    .terminal-panel {
        height: 150px;
        background-color: var(--bg-dark);
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
    }
    .terminal-header {
        padding: 5px 15px;
        border-bottom: 1px solid var(--border);
        font-size: 11px;
        color: #fff;
        display: flex;
        justify-content: space-between;
    }
    .terminal-body {
        padding: 10px 15px;
        font-family: 'Courier New', monospace;
        font-size: 12px;
        color: #4ade80;
        overflow-y: auto;
        flex-grow: 1;
    }
    .error-text { color: #ef4444; }

    /* Live Preview Area (Split Screen) */
    .preview-panel {
        width: 0%;
        background-color: #fff;
        border-left: 2px solid var(--border);
        transition: width 0.3s ease;
        display: flex;
        flex-direction: column;
    }
    .preview-panel.active { width: 45%; }
    .preview-header {
        background-color: var(--bg-darker);
        color: #fff;
        padding: 5px 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
    }
    #previewIframe { width: 100%; flex-grow: 1; border: none; background: #fff; }

    @media (max-width: 768px) {
        .sidebar { display: none; }
        .preview-panel.active { width: 100%; position: absolute; top: 35px; bottom: 0; left: 0; z-index: 1000; }
    }
</style>
</head>
<body>

<div class="app-container">
    <!-- Title Bar -->
    <div class="title-bar">
        <div class="menu">
            <span><i class="bi bi-code-square text-primary"></i> Web VS Code</span>
            <span>File</span>
            <span>Edit</span>
            <span>Run</span>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-sm btn-primary" id="runBtn" style="font-size: 12px; padding: 4px 12px; background-color: #007acc; border: none;">
                <i class="bi bi-play-fill"></i> Run Project
            </button>
            <button class="btn btn-sm btn-outline-light" id="closePreviewBtn" style="display: none; font-size: 12px;">
                <i class="bi bi-x-lg"></i> Close
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        
        <!-- Activity Bar -->
        <div class="activity-bar">
            <div class="activity-icon active"><i class="bi bi-files"></i></div>
            <div class="activity-icon"><i class="bi bi-search"></i></div>
            <div class="activity-icon"><i class="bi bi-git"></i></div>
            <div class="activity-icon"><i class="bi bi-grid-3x3-gap"></i></div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">Explorer</div>
            <div class="file-item active" data-file="index.html">
                <i class="bi bi-filetype-html text-danger"></i> index.html
            </div>
            <div class="file-item" data-file="style.css">
                <i class="bi bi-filetype-css text-primary"></i> style.css
            </div>
            <div class="file-item" data-file="script.js">
                <i class="bi bi-filetype-js text-warning"></i> script.js
            </div>
        </div>

        <!-- Editor Area -->
        <div class="editor-area">
            <!-- Tabs -->
            <div class="tabs">
                <div class="tab active" data-file="index.html" id="activeTab">
                    <i class="bi bi-filetype-html text-danger" id="tabIcon"></i> 
                    <span id="tabName">index.html</span>
                </div>
            </div>

            <!-- CodeMirror Editor -->
            <textarea id="codeEditor"></textarea>

            <!-- Terminal Panel -->
            <div class="terminal-panel">
                <div class="terminal-header">
                    <span>TERMINAL / CONSOLE</span>
                    <span style="cursor: pointer;" onclick="clearTerminal()"><i class="bi bi-trash"></i> Clear</span>
                </div>
                <div class="terminal-body" id="terminalOutput">
                    <div>> VS Code Clone Initialized.</div>
                    <div>> Ready to code...</div>
                </div>
            </div>
        </div>

        <!-- Live Preview Panel -->
        <div class="preview-panel" id="previewPanel">
            <div class="preview-header">
                <span><i class="bi bi-window"></i> Live Preview</span>
                <i class="bi bi-x-lg" style="cursor:pointer;" id="closePreviewIcon"></i>
            </div>
            <iframe id="previewIframe" sandbox="allow-scripts allow-modals allow-forms allow-same-origin"></iframe>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- CodeMirror (Working Editor Engine) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
<!-- Brackets Matching -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/matchbrackets.min.js"></script>

<script>
    /* ============================================
       VS CODE CLONE LOGIC
       ============================================ */

    // 1. Virtual File System
    const files = {
        'index.html': `<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Hello VS Code!</h1>
        <p>Edit the code and click "Run Project"</p>
        <button onclick="showMessage()">Click Me</button>
    </div>
    <script src="script.js"><\/script>
</body>
</html>`,
        'style.css': `body {
    background-color: #0f172a;
    color: white;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}
.container {
    text-align: center;
    background: #1e293b;
    padding: 40px;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
h1 { color: #38bdf8; }
button {
    background: #38bdf8;
    color: #000;
    border: none;
    padding: 10px 20px;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 20px;
}`,
        'script.js': `function showMessage() {
    alert("Hello from JavaScript!");
    console.log("Button clicked successfully.");
}`
    };

    let currentFile = 'index.html';
    let editor = null;

    // 2. Initialize CodeMirror Editor
    window.onload = function() {
        const textarea = document.getElementById('codeEditor');
        editor = CodeMirror.fromTextArea(textarea, {
            lineNumbers: true,
            mode: 'htmlmixed',
            theme: 'dracula',
            autoCloseBrackets: true,
            matchBrackets: true,
            indentUnit: 4,
            tabSize: 4,
            lineWrapping: true
        });

        // Load initial file
        editor.setValue(files['index.html']);

        // Save changes automatically
        editor.on('change', function() {
            files[currentFile] = editor.getValue();
        });

        logToTerminal('Editor loaded successfully.', 'normal');
    };

    // 3. Handle File Switching (Sidebar Click)
    document.querySelectorAll('.file-item').forEach(item => {
        item.addEventListener('click', () => {
            const filename = item.dataset.file;
            switchFile(filename);
        });
    });

    function switchFile(filename) {
        currentFile = filename;
        
        // Update sidebar active state
        document.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
        document.querySelector(`.file-item[data-file="${filename}"]`).classList.add('active');

        // Update Tab UI
        const modeMap = {
            'index.html': 'htmlmixed',
            'style.css': 'css',
            'script.js': 'javascript'
        };
        
        const iconMap = {
            'index.html': 'bi-filetype-html text-danger',
            'style.css': 'bi-filetype-css text-primary',
            'script.js': 'bi-filetype-js text-warning'
        };

        document.getElementById('tabName').textContent = filename;
        document.getElementById('tabIcon').className = `bi ${iconMap[filename]}`;

        // Update Editor Content & Language Mode
        if (editor) {
            editor.setOption('mode', modeMap[filename]);
            editor.setValue(files[filename]);
            editor.focus();
        }
    }

    // 4. Terminal Output Function
    function logToTerminal(msg, type = 'normal') {
        const terminal = document.getElementById('terminalOutput');
        const line = document.createElement('div');
        line.className = type === 'error' ? 'error-text' : '';
        line.textContent = `> ${msg}`;
        terminal.appendChild(line);
        terminal.scrollTop = terminal.scrollHeight;
    }

    function clearTerminal() {
        document.getElementById('terminalOutput').innerHTML = '';
    }

    // 5. Run Project (Live Preview)
    document.getElementById('runBtn').addEventListener('click', () => {
        logToTerminal('Starting build process...', 'normal');

        const html = files['index.html'];
        const css = files['style.css'];
        const js = files['script.js'];

        // Combine into one file
        let finalHtml = html.replace('<link rel="stylesheet" href="style.css">', `<style>${css}</style>`);
        
        // Add error catching and logging injection
        finalHtml = finalHtml.replace('<script src="script.js"></script>', `
            <script>
                window.onerror = function(message, source, lineno, colno, error) {
                    window.parent.postMessage({ type: 'error', message: message + ' (Line ' + lineno + ')' }, '*');
                    return true;
                };
                const originalLog = console.log;
                console.log = function(...args) {
                    window.parent.postMessage({ type: 'log', message: args.join(' ') }, '*');
                    originalLog.apply(console, args);
                };
                ${js}
            <\/script>
        `);

        // Show Preview Panel
        const previewPanel = document.getElementById('previewPanel');
        previewPanel.classList.add('active');
        document.getElementById('closePreviewBtn').style.display = 'inline-block';
        
        // Load into iframe
        const iframe = document.getElementById('previewIframe');
        iframe.srcdoc = finalHtml;

        logToTerminal('Build successful. Check preview.', 'normal');
    });

    // Close Preview
    function closePreview() {
        const previewPanel = document.getElementById('previewPanel');
        previewPanel.classList.remove('active');
        document.getElementById('closePreviewBtn').style.display = 'none';
        document.getElementById('previewIframe').srcdoc = ''; // Clear iframe
    }

    document.getElementById('closePreviewBtn').addEventListener('click', closePreview);
    document.getElementById('closePreviewIcon').addEventListener('click', closePreview);

    // 6. Listen for messages from iframe (console logs and errors)
    window.addEventListener('message', (event) => {
        if (event.data.type === 'error') {
            logToTerminal('ERROR: ' + event.data.message, 'error');
        } else if (event.data.type === 'log') {
            logToTerminal(event.data.message, 'normal');
        }
    });

</script>
</body>
</html>
