<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<style>
body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:1rem;font-family:system-ui;margin:0;overflow-x:hidden}
body[data-bs-theme="dark"]{background:linear-gradient(135deg,#0f172a,#1e293b)}
.app{max-width:440px;margin:0 auto}

.card-glass{background:#fff;border-radius:22px;padding:1.25rem;box-shadow:0 20px 50px rgba(0,0,0,.2);margin-bottom:1rem}
body[data-bs-theme="dark"] .card-glass{background:#1e293b;color:#e5e7eb}

.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.app-title{font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:.4rem}
.icon-btn{width:40px;height:40px;border-radius:50%;border:none;background:#f3f4f6;color:#374151;font-size:1rem;cursor:pointer;transition:all .15s}
body[data-bs-theme="dark"] .icon-btn{background:#374151;color:#e5e7eb}
.icon-btn:hover{background:#e5e7eb}
body[data-bs-theme="dark"] .icon-btn:hover{background:#4b5563}

.mode-tabs{display:flex;background:#f3f4f6;border-radius:50px;padding:4px;margin-bottom:1rem}
body[data-bs-theme="dark"] .mode-tabs{background:#334155}
.mode-tab{flex:1;padding:.6rem;border-radius:50px;border:none;background:transparent;color:#6b7280;font-weight:700;font-size:.85rem;cursor:pointer;transition:all .2s}
.mode-tab.active{background:#fff;color:#667eea;box-shadow:0 2px 8px rgba(0,0,0,.08)}
body[data-bs-theme="dark"] .mode-tab.active{background:#667eea;color:#fff}

.difficulty-row{display:flex;gap:.4rem;margin-bottom:1rem}
.diff-btn{flex:1;padding:.5rem;border-radius:10px;border:2px solid #e5e7eb;background:#fff;color:#6b7280;font-weight:700;font-size:.8rem;cursor:pointer;transition:all .15s}
body[data-bs-theme="dark"] .diff-btn{background:#334155;border-color:#475569;color:#cbd5e1}
.diff-btn.active{background:#667eea;border-color:#667eea;color:#fff}
.diff-btn.hidden{display:none}

/* Scoreboard */
.scoreboard{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-bottom:1rem}
.score-box{background:#f3f4f6;border-radius:14px;padding:.75rem .5rem;text-align:center;transition:all .2s}
body[data-bs-theme="dark"] .score-box{background:#334155}
.score-box.active{background:#667eea;color:#fff;transform:scale(1.05)}
.score-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.7}
.score-num{font-size:1.6rem;font-weight:800;line-height:1.1}

/* Turn indicator */
.turn-indicator{text-align:center;padding:.75rem;background:#f3f4f6;border-radius:14px;margin-bottom:1rem;font-weight:700;font-size:1rem}
body[data-bs-theme="dark"] .turn-indicator{background:#334155}
.turn-indicator .badge-x{color:#ef4444}
.turn-indicator .badge-o{color:#3b82f6}

/* Board */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:1rem;aspect-ratio:1}
.cell{background:#f3f4f6;border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;user-select:none;position:relative;overflow:hidden}
body[data-bs-theme="dark"] .cell{background:#334155}
.cell:hover:not(.filled):not(.disabled){background:#e5e7eb;transform:scale(1.03)}
body[data-bs-theme="dark"] .cell:hover:not(.filled):not(.disabled){background:#475569}
.cell.disabled{cursor:not-allowed}
.cell.filled{cursor:not-allowed}
.cell .mark{font-size:3.5rem;font-weight:900;line-height:1;animation:pop .25s ease-out}
@keyframes pop{0%{transform:scale(0) rotate(-45deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.cell .mark.x{color:#ef4444;text-shadow:0 2px 8px rgba(239,68,68,.3)}
.cell .mark.o{color:#3b82f6;text-shadow:0 2px 8px rgba(59,130,246,.3)}
.cell.winning{background:linear-gradient(135deg,#fef3c7,#fde68a);animation:winPulse .6s ease-in-out}
body[data-bs-theme="dark"] .cell.winning{background:linear-gradient(135deg,#78350f,#92400e)}
@keyframes winPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* Buttons */
.btn-main{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:14px;padding:.8rem 1.5rem;font-weight:700;width:100%;transition:transform .15s;box-shadow:0 8px 20px rgba(102,126,234,.4)}
.btn-main:hover{transform:translateY(-2px);color:#fff}
.btn-main:active{transform:translateY(0)}

.toast-mini{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:.75rem 1.5rem;border-radius:50px;font-weight:700;box-shadow:0 8px 20px rgba(16,185,129,.4);z-index:9999;animation:slideDown .3s;font-size:.9rem}
@keyframes slideDown{from{transform:translate(-50%,-100%);opacity:0}to{transform:translate(-50%,0);opacity:1}}

@media(max-width:400px){.cell .mark{font-size:3rem}}
</style>
</head>
<body>
<div class="app">

  <!-- Top bar -->
  <div class="top-bar">
    <div class="app-title">🎮 Tic Tac Toe</div>
    <button class="icon-btn" id="themeBtn"><i class="bi bi-moon-stars"></i></button>
  </div>

  <!-- Mode tabs -->
  <div class="card-glass">
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="pvp">👥 2 Player</button>
      <button class="mode-tab" data-mode="ai">🤖 vs AI</button>
    </div>

    <!-- Difficulty (only for AI mode) -->
    <div class="difficulty-row hidden" id="difficultyRow">
      <button class="diff-btn" data-diff="easy">Easy</button>
      <button class="diff-btn active" data-diff="medium">Medium</button>
      <button class="diff-btn" data-diff="hard">Hard 🔥</button>
    </div>

    <!-- Scoreboard -->
    <div class="scoreboard">
      <div class="score-box" id="scoreX">
        <div class="score-label" id="labelX">Player X</div>
        <div class="score-num" id="numX">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Draws</div>
        <div class="score-num" id="numDraw">0</div>
      </div>
      <div class="score-box" id="scoreO">
        <div class="score-label" id="labelO">Player O</div>
        <div class="score-num" id="numO">0</div>
      </div>
    </div>

    <!-- Turn indicator -->
    <div class="turn-indicator" id="turnIndicator">
      <span>Player <span class="badge-x">X</span>'s turn</span>
    </div>

    <!-- Board -->
    <div class="board" id="board">
      <div class="cell" data-idx="0"></div>
      <div class="cell" data-idx="1"></div>
      <div class="cell" data-idx="2"></div>
      <div class="cell" data-idx="3"></div>
      <div class="cell" data-idx="4"></div>
      <div class="cell" data-idx="5"></div>
      <div class="cell" data-idx="6"></div>
      <div class="cell" data-idx="7"></div>
      <div class="cell" data-idx="8"></div>
    </div>

    <!-- Actions -->
    <div class="row g-2">
      <div class="col-6"><button class="btn-main" id="resetBtn"><i class="bi bi-arrow-clockwise me-1"></i>Reset</button></div>
      <div class="col-6"><button class="btn-main" id="newGameBtn" style="background:linear-gradient(135deg,#ef4444,#dc2626)"><i class="bi bi-trash me-1"></i>New Game</button></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ============================================
   TIC TAC TOE
   ============================================ */

// ---------- STATE ----------
let board = ['', '', '', '', '', '', '', '', ''];
let currentPlayer = 'X';
let gameOver = false;
let mode = 'pvp'; // 'pvp' or 'ai'
let difficulty = 'medium'; // 'easy', 'medium', 'hard'
let theme = localStorage.getItem('ttt-theme') || 'light';

// Scores
let scores = JSON.parse(localStorage.getItem('ttt-scores') || '{"x":0,"o":0,"draw":0}');

// ---------- WINNING COMBINATIONS ----------
const WINS = [
  [0,1,2],[3,4,5],[6,7,8], // rows
  [0,3,6],[1,4,7],[2,5,8], // cols
  [0,4,8],[2,4,6]          // diagonals
];

// ---------- ELEMENTS ----------
const boardEl = document.getElementById('board');
const cells = document.querySelectorAll('.cell');
const turnInd = document.getElementById('turnIndicator');

// ---------- SOUND ----------
let audioCtx = null;
function beep(freq = 600, duration = 0.1) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

// ---------- CHECK WINNER ----------
function checkWinner(board) {
  for (const combo of WINS) {
    const [a,b,c] = combo;
    if (board[a] && board[a] === board[b] && board[a] === board[c]) {
      return { winner: board[a], combo };
    }
  }
  if (board.every(c => c !== '')) return { winner: 'draw', combo: null };
  return null;
}

// ---------- RENDER ----------
function render(winningCombo = null) {
  board.forEach((val, i) => {
    const cell = cells[i];
    cell.classList.toggle('filled', val !== '');
    if (val && !cell.querySelector('.mark')) {
      cell.innerHTML = `<span class="mark ${val.toLowerCase()}">${val}</span>`;
    }
    if (!val) cell.innerHTML = '';
    cell.classList.toggle('winning', winningCombo && winningCombo.includes(i));
  });

  // Turn indicator
  if (gameOver) return;
  if (mode === 'ai') {
    turnInd.innerHTML = currentPlayer === 'X' 
      ? 'Your turn (<span class="badge-x">X</span>)' 
      : 'AI thinking... <span class="badge-o">O</span>';
  } else {
    turnInd.innerHTML = `Player <span class="${currentPlayer === 'X' ? 'badge-x' : 'badge-o'}">${currentPlayer}</span>'s turn`;
  }

  // Active score highlight
  document.getElementById('scoreX').classList.toggle('active', currentPlayer === 'X' && !gameOver);
  document.getElementById('scoreO').classList.toggle('active', currentPlayer === 'O' && !gameOver);
}

// ---------- HANDLE MOVE ----------
function makeMove(idx) {
  if (board[idx] !== '' || gameOver) return;

  board[idx] = currentPlayer;
  beep(currentPlayer === 'X' ? 700 : 500, 0.08);

  const result = checkWinner(board);
  if (result) {
    endGame(result);
  } else {
    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    render();

    // AI move if applicable
    if (mode === 'ai' && currentPlayer === 'O' && !gameOver) {
      setTimeout(aiMove, 500);
    }
  }
}

// ---------- END GAME ----------
function endGame({ winner, combo }) {
  gameOver = true;
  render(combo);

  if (winner === 'draw') {
    scores.draw++;
    turnInd.innerHTML = '🤝 It\'s a draw!';
    beep(400, 0.3);
  } else {
    if (winner === 'X') scores.x++;
    else scores.o++;
    const winnerName = mode === 'ai' 
      ? (winner === 'X' ? 'You win! 🎉' : 'AI wins! 🤖')
      : `Player ${winner} wins!`;
    turnInd.innerHTML = `<strong>${winnerName}</strong>`;
    beep(winner === 'X' ? 800 : 1000, 0.2);
    setTimeout(() => beep(winner === 'X' ? 1000 : 800, 0.2), 150);
  }

  saveScores();
  updateScoreUI();
  render(combo);
}

// ---------- AI MOVE ----------
function aiMove() {
  if (gameOver || currentPlayer !== 'O') return;

  let move;
  const empty = board.map((v,i) => v === '' ? i : null).filter(v => v !== null);

  if (difficulty === 'easy') {
    move = empty[Math.floor(Math.random() * empty.length)];
  } else if (difficulty === 'medium') {
    // 50% optimal, 50% random
    if (Math.random() < 0.5) move = minimaxMove();
    else move = empty[Math.floor(Math.random() * empty.length)];
  } else {
    // Hard - always optimal
    move = minimaxMove();
  }

  makeMove(move);
}

// ---------- MINIMAX (unbeatable AI) ----------
function minimaxMove() {
  let bestScore = -Infinity;
  let bestMove = null;

  for (let i = 0; i < 9; i++) {
    if (board[i] === '') {
      board[i] = 'O';
      const score = minimax(board, 0, false);
      board[i] = '';
      if (score > bestScore) {
        bestScore = score;
        bestMove = i;
      }
    }
  }
  return bestMove;
}

function minimax(b, depth, isMax) {
  const result = checkWinner(b);
  if (result) {
    if (result.winner === 'O') return 10 - depth;
    if (result.winner === 'X') return depth - 10;
    return 0;
  }

  if (isMax) {
    let best = -Infinity;
    for (let i = 0; i < 9; i++) {
      if (b[i] === '') {
        b[i] = 'O';
        best = Math.max(best, minimax(b, depth + 1, false));
        b[i] = '';
      }
    }
    return best;
  } else {
    let best = Infinity;
    for (let i = 0; i < 9; i++) {
      if (b[i] === '') {
        b[i] = 'X';
        best = Math.min(best, minimax(b, depth + 1, true));
        b[i] = '';
      }
    }
    return best;
  }
}

// ---------- SCORES ----------
function saveScores() {
  localStorage.setItem('ttt-scores', JSON.stringify(scores));
}

function updateScoreUI() {
  document.getElementById('numX').textContent = scores.x;
  document.getElementById('numO').textContent = scores.o;
  document.getElementById('numDraw').textContent = scores.draw;

  if (mode === 'ai') {
    document.getElementById('labelX').textContent = 'You (X)';
    document.getElementById('labelO').textContent = 'AI (O)';
  } else {
    document.getElementById('labelX').textContent = 'Player X';
    document.getElementById('labelO').textContent = 'Player O';
  }
}

// ---------- RESET ----------
function resetBoard() {
  board = ['', '', '', '', '', '', '', '', ''];
  currentPlayer = 'X';
  gameOver = false;
  cells.forEach(c => { c.innerHTML = ''; c.className = 'cell'; });
  document.getElementById('scoreX').classList.remove('active');
  document.getElementById('scoreO').classList.remove('active');
  render();
}

function newGame() {
  if (!confirm('Reset scores and start fresh?')) return;
  scores = { x: 0, o: 0, draw: 0 };
  saveScores();
  updateScoreUI();
  resetBoard();
  showToast('New game started!');
}

// ---------- TOAST ----------
function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast-mini';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

// ---------- THEME ----------
function applyTheme() {
  document.documentElement.setAttribute('data-bs-theme', theme);
  document.getElementById('themeBtn').innerHTML = theme === 'dark' 
    ? '<i class="bi bi-sun"></i>' 
    : '<i class="bi bi-moon-stars"></i>';
}
document.getElementById('themeBtn').onclick = () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('ttt-theme', theme);
  applyTheme();
};

// ---------- EVENTS ----------
cells.forEach(cell => {
  cell.onclick = () => {
    if (mode === 'ai' && currentPlayer === 'O') return; // AI's turn
    makeMove(parseInt(cell.dataset.idx));
  };
});

document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    mode = tab.dataset.mode;

    document.getElementById('difficultyRow').classList.toggle('hidden', mode !== 'ai');
    updateScoreUI();
    resetBoard();
  };
});

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    difficulty = btn.dataset.diff;
    resetBoard();
  };
});

document.getElementById('resetBtn').onclick = resetBoard;
document.getElementById('newGameBtn').onclick = newGame;

// ---------- INIT ----------
applyTheme();
updateScoreUI();
render();
</script>
</body>
</html>
