<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<style>
body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:1rem;font-family:system-ui}
.app{max-width:600px;margin:0 auto}
.card-glass{background:#fff;border-radius:20px;padding:1.5rem;box-shadow:0 10px 30px rgba(0,0,0,.15);margin-bottom:1rem}
.habit-row{display:flex;align-items:center;gap:.75rem;padding:.75rem;border-radius:12px;background:#f8f9fa;margin-bottom:.5rem}
.habit-row.done{background:#d1fae5}
.habit-check{width:44px;height:44px;border-radius:50%;border:2px solid #cbd5e1;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;cursor:pointer;transition:all .2s;flex-shrink:0}
.habit-check.done{background:#10b981;border-color:#10b981;color:#fff}
.habit-name{flex-grow:1;font-weight:600}
.habit-streak{font-size:.8rem;color:#6b7280}
.progress{height:8px;border-radius:10px}
.stat-box{text-align:center;padding:.75rem;background:#f8f9fa;border-radius:12px}
.stat-num{font-size:1.5rem;font-weight:800;color:#667eea}
.stat-lbl{font-size:.75rem;color:#6b7280}
.fab{position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;background:#667eea;color:#fff;border:none;font-size:1.5rem;box-shadow:0 8px 20px rgba(102,126,234,.4);z-index:100}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="card-glass">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h3 class="fw-bold mb-0">🎯 Habit Tracker</h3>
        <small class="text-muted" id="todayDate"></small>
      </div>
      <button class="btn btn-light" id="themeBtn"><i class="bi bi-moon-stars"></i></button>
    </div>
  </div>

  <!-- Stats -->
  <div class="card-glass">
    <div class="row g-2">
      <div class="col-4"><div class="stat-box"><div class="stat-num" id="statTotal">0</div><div class="stat-lbl">Total</div></div></div>
      <div class="col-4"><div class="stat-box"><div class="stat-num" id="statDone">0</div><div class="stat-lbl">Done Today</div></div></div>
      <div class="col-4"><div class="stat-box"><div class="stat-num" id="statBest">0</div><div class="stat-lbl">Best Streak</div></div></div>
    </div>
    <div class="mt-3">
      <div class="d-flex justify-content-between mb-1"><small class="fw-bold">Today's Progress</small><small id="progressText">0%</small></div>
      <div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    </div>
  </div>

  <!-- Habits List -->
  <div class="card-glass">
    <h6 class="fw-bold mb-3">My Habits</h6>
    <div id="habitList"></div>
  </div>

</div>

<!-- Add Button -->
<button class="fab" id="addBtn"><i class="bi bi-plus-lg"></i></button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ---------- STATE ----------
let habits = JSON.parse(localStorage.getItem('habits') || '[]');
let theme = localStorage.getItem('theme') || 'light';

// ---------- DATE HELPERS ----------
function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

function calcStreak(habit) {
  let streak = 0;
  const d = new Date();
  while (true) {
    const key = d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
    if (habit.dates.includes(key)) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else break;
  }
  return streak;
}

// ---------- SAVE ----------
function save() { localStorage.setItem('habits', JSON.stringify(habits)); }

// ---------- RENDER ----------
function render() {
  // Date
  document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

  // Stats
  document.getElementById('statTotal').textContent = habits.length;
  const today = todayKey();
  const doneCount = habits.filter(h => h.dates.includes(today)).length;
  document.getElementById('statDone').textContent = doneCount;
  const best = habits.length ? Math.max(...habits.map(h => calcStreak(h))) : 0;
  document.getElementById('statBest').textContent = best;

  // Progress
  const pct = habits.length ? Math.round((doneCount / habits.length) * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '%';

  // List
  const list = document.getElementById('habitList');
  if (habits.length === 0) {
    list.innerHTML = '<div class="text-center text-muted py-4"><i class="bi bi-clipboard display-4 d-block mb-2 opacity-25"></i>No habits yet. Tap + to add one!</div>';
    return;
  }

  list.innerHTML = habits.map((h, i) => {
    const isDone = h.dates.includes(today);
    const streak = calcStreak(h);
    return '<div class="habit-row ' + (isDone ? 'done' : '') + '">' +
      '<div class="habit-check ' + (isDone ? 'done' : '') + '" data-idx="' + i + '">' +
        (isDone ? '✓' : '') +
      '</div>' +
      '<div class="flex-grow-1">' +
        '<div class="habit-name">' + h.name + '</div>' +
        '<div class="habit-streak">🔥 ' + streak + ' day streak</div>' +
      '</div>' +
      '<button class="btn btn-sm btn-light text-danger" data-del="' + i + '">' +
        '<i class="bi bi-trash"></i>' +
      '</button>' +
    '</div>';
  }).join('');

  // Attach events
  document.querySelectorAll('.habit-check').forEach(el => {
    el.onclick = () => toggleHabit(parseInt(el.dataset.idx));
  });
  document.querySelectorAll('[data-del]').forEach(el => {
    el.onclick = () => deleteHabit(parseInt(el.dataset.del));
  });
}

// ---------- ACTIONS ----------
function toggleHabit(idx) {
  const today = todayKey();
  const h = habits[idx];
  if (h.dates.includes(today)) {
    h.dates = h.dates.filter(d => d !== today);
  } else {
    h.dates.push(today);
  }
  save();
  render();
}

function deleteHabit(idx) {
  if (!confirm('Delete "' + habits[idx].name + '"?')) return;
  habits.splice(idx, 1);
  save();
  render();
}

function addHabit() {
  const name = prompt('Habit name (e.g., Drink Water, Exercise):');
  if (!name || !name.trim()) return;
  habits.push({ name: name.trim(), dates: [], createdAt: Date.now() });
  save();
  render();
}

// ---------- THEME ----------
function applyTheme() {
  document.documentElement.setAttribute('data-bs-theme', theme);
  document.getElementById('themeBtn').innerHTML = theme === 'dark' ? '<i class="bi bi-sun"></i>' : '<i class="bi bi-moon-stars"></i>';
}

document.getElementById('themeBtn').onclick = () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', theme);
  applyTheme();
};

document.getElementById('addBtn').onclick = addHabit;

// ---------- INIT ----------
applyTheme();
render();
</script>
</body>
</html>
