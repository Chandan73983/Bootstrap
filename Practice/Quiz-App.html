<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz App</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<style>
body{background:linear-gradient(135deg,#8e2de2,#4a00e0);min-height:100vh;padding:1rem;font-family:system-ui}
.app{max-width:600px;margin:0 auto}
.card-glass{background:#fff;border-radius:20px;padding:1.5rem;box-shadow:0 10px 30px rgba(0,0,0,.2);margin-bottom:1rem}
.timer-box{display:flex;align-items:center;justify-content:center;width:80px;height:80px;border-radius:50%;margin:0 auto;background:conic-gradient(#10b981 var(--p),#e5e7eb 0);position:relative}
.timer-box::before{content:'';position:absolute;inset:6px;background:#fff;border-radius:50%}
.timer-num{position:relative;z-index:1;font-size:1.6rem;font-weight:800;color:#10b981}
.timer-box.warn{background:conic-gradient(#ef4444 var(--p),#e5e7eb 0)}
.timer-box.warn .timer-num{color:#ef4444}
.option{display:block;width:100%;text-align:left;padding:1rem 1.25rem;margin-bottom:.6rem;border:2px solid #e5e7eb;border-radius:14px;background:#fff;font-weight:600;transition:all .15s;cursor:pointer}
.option:hover:not(.disabled){border-color:#8e2de2;transform:translateX(4px)}
.option.correct{background:#d1fae5;border-color:#10b981;color:#065f46}
.option.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.option.disabled{cursor:not-allowed;opacity:.7}
.q-num{font-size:.8rem;color:#8e2de2;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.q-text{font-size:1.2rem;font-weight:700;margin:.5rem 0 1.25rem;line-height:1.4}
.result-circle{width:140px;height:140px;border-radius:50%;margin:0 auto 1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#8e2de2,#4a00e0);color:#fff}
.result-score{font-size:2.5rem;font-weight:800;line-height:1}
.result-max{font-size:1rem;opacity:.8}
.btn-purple{background:#8e2de2;color:#fff;border:none;padding:.75rem 1.5rem;border-radius:12px;font-weight:700}
.btn-purple:hover{background:#7a1fd0;color:#fff}
.stat-box{background:#f8f9fa;border-radius:12px;padding:.75rem;text-align:center}
.stat-box .num{font-size:1.5rem;font-weight:800;color:#8e2de2}
.stat-box .lbl{font-size:.75rem;color:#6b7280;font-weight:600}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="card-glass">
    <div class="d-flex justify-content-between align-items-center">
      <h4 class="fw-bold mb-0">🎯 Quiz App</h4>
      <button class="btn btn-light" id="themeBtn"><i class="bi bi-moon-stars"></i></button>
    </div>
  </div>

  <!-- Start Screen -->
  <div class="card-glass text-center" id="startScreen">
    <i class="bi bi-patch-question display-1 text-primary mb-2"></i>
    <h4 class="fw-bold">Ready to Test Yourself?</h4>
    <p class="text-muted">10 questions • 30 seconds each</p>
    <div class="row g-2 my-3">
      <div class="col-6"><div class="stat-box"><div class="num" id="highScore">0</div><div class="lbl">High Score</div></div></div>
      <div class="col-6"><div class="stat-box"><div class="num" id="totalAttempts">0</div><div class="lbl">Attempts</div></div></div>
    </div>
    <button class="btn-purple w-100 mt-2" id="startBtn">Start Quiz <i class="bi bi-arrow-right ms-1"></i></button>
  </div>

  <!-- Quiz Screen -->
  <div class="card-glass" id="quizScreen" style="display:none">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="q-num" id="qCounter">Question 1 of 10</span>
      <span class="badge bg-primary" id="scoreBadge">Score: 0</span>
    </div>
    <div class="progress mb-3" style="height:6px">
      <div class="progress-bar bg-primary" id="progressBar" style="width:10%"></div>
    </div>
    <div class="timer-box" id="timerBox" style="--p:100%">
      <span class="timer-num" id="timerNum">30</span>
    </div>
    <div class="q-text" id="questionText">Loading...</div>
    <div id="optionsList"></div>
  </div>

  <!-- Result Screen -->
  <div class="card-glass text-center" id="resultScreen" style="display:none">
    <div class="result-circle">
      <div class="result-score" id="finalScore">0</div>
      <div class="result-max">out of 10</div>
    </div>
    <h4 class="fw-bold" id="resultTitle">Good Job! 🎉</h4>
    <p class="text-muted" id="resultMsg">You're doing great</p>
    <div class="row g-2 my-3">
      <div class="col-4"><div class="stat-box"><div class="num" id="correctCount">0</div><div class="lbl">Correct</div></div></div>
      <div class="col-4"><div class="stat-box"><div class="num" id="wrongCount">0</div><div class="lbl">Wrong</div></div></div>
      <div class="col-4"><div class="stat-box"><div class="num" id="accuracy">0%</div><div class="lbl">Accuracy</div></div></div>
    </div>
    <button class="btn-purple w-100" id="restartBtn">Play Again <i class="bi bi-arrow-clockwise ms-1"></i></button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ---------- QUESTIONS ----------
const QUESTIONS = [
  { q: "Which HTML tag creates the largest heading?", options: ["<h6>","<heading>","<h1>","<head>"], correct: 2 },
  { q: "Which CSS property changes text color?", options: ["font-color","text-color","color","text-style"], correct: 2 },
  { q: "Which Bootstrap class creates a container?", options: ["container","wrapper","box","frame"], correct: 0 },
  { q: "What does HTML stand for?", options: ["Hyper Text Markup Language","Home Tool Markup Language","Hyperlinks Text Mark Language","None"], correct: 0 },
  { q: "Which is NOT a Bootstrap breakpoint?", options: ["sm","md","lg","xxs"], correct: 3 },
  { q: "Which JavaScript keyword declares a variable that cannot be reassigned?", options: ["var","let","const","fixed"], correct: 2 },
  { q: "What does CSS stand for?", options: ["Creative Style Sheets","Computer Style Sheets","Cascading Style Sheets","Colorful Style Sheets"], correct: 2 },
  { q: "Which Bootstrap class makes a row responsive with 3 columns on desktop?", options: ["col-lg-3","col-lg-4","col-md-4","col-3"], correct: 1 },
  { q: "How do you select an element by ID in CSS?", options: [".id","#id","*id","@id"], correct: 1 },
  { q: "Which method adds element to end of array in JS?", options: ["push()","pop()","shift()","unshift()"], correct: 0 }
];

// ---------- STATE ----------
let current = 0;
let score = 0;
let correctCount = 0;
let wrongCount = 0;
let timer = null;
let timeLeft = 30;
let locked = false;
let theme = localStorage.getItem('quiz-theme') || 'light';
let highScore = parseInt(localStorage.getItem('quiz-high') || '0');
let attempts = parseInt(localStorage.getItem('quiz-attempts') || '0');

// ---------- ELEMENTS ----------
const startScreen = document.getElementById('startScreen');
const quizScreen = document.getElementById('quizScreen');
const resultScreen = document.getElementById('resultScreen');

// ---------- START QUIZ ----------
function startQuiz() {
  current = 0; score = 0; correctCount = 0; wrongCount = 0;
  startScreen.style.display = 'none';
  resultScreen.style.display = 'none';
  quizScreen.style.display = 'block';
  loadQuestion();
}

// ---------- LOAD QUESTION ----------
function loadQuestion() {
  if (current >= QUESTIONS.length) return finishQuiz();
  
  locked = false;
  const q = QUESTIONS[current];
  document.getElementById('qCounter').textContent = `Question ${current+1} of ${QUESTIONS.length}`;
  document.getElementById('scoreBadge').textContent = `Score: ${score}`;
  document.getElementById('progressBar').style.width = ((current+1)/QUESTIONS.length*100) + '%';
  document.getElementById('questionText').textContent = q.q;

  const list = document.getElementById('optionsList');
  list.innerHTML = q.options.map((opt, i) => 
    `<button class="option" data-idx="${i}">${String.fromCharCode(65+i)}. ${opt}</button>`
  ).join('');
  list.querySelectorAll('.option').forEach(b => b.onclick = () => selectAnswer(parseInt(b.dataset.idx)));

  startTimer();
}

// ---------- TIMER ----------
function startTimer() {
  clearInterval(timer);
  timeLeft = 30;
  updateTimerUI();
  timer = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) {
      clearInterval(timer);
      if (!locked) selectAnswer(-1); // Time out
    }
  }, 1000);
}

function updateTimerUI() {
  const box = document.getElementById('timerBox');
  const num = document.getElementById('timerNum');
  num.textContent = timeLeft;
  const pct = (timeLeft / 30) * 100;
  box.style.setProperty('--p', pct + '%');
  box.classList.toggle('warn', timeLeft <= 10);
}

// ---------- SELECT ANSWER ----------
function selectAnswer(idx) {
  if (locked) return;
  locked = true;
  clearInterval(timer);

  const q = QUESTIONS[current];
  const buttons = document.querySelectorAll('.option');
  buttons.forEach((b, i) => {
    b.classList.add('disabled');
    if (i === q.correct) b.classList.add('correct');
    if (i === idx && idx !== q.correct) b.classList.add('wrong');
  });

  if (idx === q.correct) {
    score += 10;
    correctCount++;
  } else {
    wrongCount++;
  }

  document.getElementById('scoreBadge').textContent = `Score: ${score}`;

  setTimeout(() => {
    current++;
    loadQuestion();
  }, 1200);
}

// ---------- FINISH ----------
function finishQuiz() {
  clearInterval(timer);
  quizScreen.style.display = 'none';
  resultScreen.style.display = 'block';

  const total = QUESTIONS.length;
  const accuracy = Math.round((correctCount / total) * 100);

  document.getElementById('finalScore').textContent = correctCount;
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('wrongCount').textContent = wrongCount;
  document.getElementById('accuracy').textContent = accuracy + '%';

  let title = 'Keep Practicing! 💪';
  let msg = 'Try again to improve your score';
  if (accuracy >= 80) { title = 'Excellent! 🏆'; msg = 'You are a pro!'; }
  else if (accuracy >= 60) { title = 'Good Job! 🎉'; msg = 'You are getting there'; }
  else if (accuracy >= 40) { title = 'Not Bad! 👍'; msg = 'Keep learning'; }

  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultMsg').textContent = msg;

  // Save stats
  attempts++;
  if (score > highScore) highScore = score;
  localStorage.setItem('quiz-high', highScore);
  localStorage.setItem('quiz-attempts', attempts);
  updateHomeStats();
}

// ---------- HOME STATS ----------
function updateHomeStats() {
  document.getElementById('highScore').textContent = highScore;
  document.getElementById('totalAttempts').textContent = attempts;
}

// ---------- THEME ----------
function applyTheme() {
  document.documentElement.setAttribute('data-bs-theme', theme);
  document.getElementById('themeBtn').innerHTML = theme==='dark' ? '<i class="bi bi-sun"></i>' : '<i class="bi bi-moon-stars"></i>';
}

document.getElementById('themeBtn').onclick = () => {
  theme = theme==='dark' ? 'light' : 'dark';
  localStorage.setItem('quiz-theme', theme);
  applyTheme();
};

// ---------- EVENTS ----------
document.getElementById('startBtn').onclick = startQuiz;
document.getElementById('restartBtn').onclick = startQuiz;

// ---------- INIT ----------
applyTheme();
updateHomeStats();
</script>
</body>
</html>
